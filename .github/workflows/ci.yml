name: Frontend CI & Build Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies with clean lockfile
        run: |
          npm ci

      - name: Run TypeScript typecheck and Vite production build
        run: |
          npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "Build verification failed: dist/index.html missing"; exit 1; }
          echo "Frontend production build successfully verified."
